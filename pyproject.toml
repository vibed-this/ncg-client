[project]
name = "ncg-client"
version = "0.1.0"
description = "NetEase cloud game third-party client: PC, video-only, mouse and text input"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "attrs>=23.0",
    "cattrs>=23.0",
    "click>=8.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "aiortc>=1.9",
    "pygame>=2.6.1",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
ncg = "ncg.cli:main"
ncg-demo = "ncg.demo.player:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingImports = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUntypedBaseClass = false
reportReturnType = false
